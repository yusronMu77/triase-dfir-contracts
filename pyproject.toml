[project]
name = "astria-contracts"
version = "0.4.0"
description = "Kontrak Astria: JSON Schema event, OpenAPI internal, dan model Pydantic hasil generasi (astria_contracts)."
requires-python = ">=3.14"
dependencies = ["pydantic>=2.14.3,<3"]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.90.0",
    "jsonschema>=4.25,<5",
    "pytest==9.2.0",
    "pyyaml>=6.0.2,<7",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gen/python/astria_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"events" = "astria_contracts/schemas/events"
"openapi" = "astria_contracts/schemas/openapi"

[tool.hatch.build.targets.sdist]
include = ["events", "openapi", "gen", "scripts", "tests", "README.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"gen/**" = ["E501", "UP", "B"]
"scripts/**" = ["S603", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["astria_contracts"]
