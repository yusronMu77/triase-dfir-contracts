openapi: 3.1.0
info:
  title: Astria audit internal API
  version: 0.3.0
  description: |
    Jalur sinkron (fail-closed) untuk aksi kritis, baca bertahap, tugas verifikasi rantai, ekspor JSONL, dan jangkar.
    Jalur asinkron memakai event `audit.record` di subjek `astria.audit.record`.
    Autentikasi: token layanan EdDSA dengan `aud = svc:audit`.

    Izin: menulis (`POST /records`) boleh dari layanan mana pun. Membaca, verifikasi, ekspor, dan jangkar hanya dari
    layanan pembaca (`svc:api`, `svc:scheduler`; dapat diatur). Bila token membawa klaim `act` (pengguna), perannya
    harus `admin` atau `dfir` untuk baca; `admin` untuk verifikasi, ekspor, dan membuat jangkar.
    Kode galat khusus: `PAYLOAD_MISMATCH` (409), `PAYLOAD_TIDAK_KANONIK` (422), `PAYLOAD_TERLALU_BESAR` (413),
    `PERAN_TIDAK_CUKUP` (403), `PEMANGGIL_DITOLAK` (403), `TUGAS_TIDAK_DITEMUKAN` (404), `AUDIT_TIDAK_TERSEDIA` (503).
    Ekspor: `EKSPOR_WAJIB_TERENKRIPSI` dan `PENERIMA_TIDAK_DIIZINKAN` (keduanya 400).
servers:
  - url: http://audit:8000
security: [{serviceToken: []}]
paths:
  /internal/v1/records:
    post:
      operationId: writeRecord
      summary: Tulis satu catatan dan tunggu nomor urut
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "../events/audit.record.schema.json"}
      responses:
        "201":
          description: Tercatat
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecordReceipt"}
        "200":
          description: Duplikat (kunci dan isi sama); mengembalikan nomor yang sudah ada
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecordReceipt"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
    get:
      operationId: listRecords
      summary: Baca bertahap
      parameters:
        - {name: from_seq, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: actor, in: query, schema: {type: string, maxLength: 64}}
        - {name: action, in: query, schema: {type: string, maxLength: 100}}
        - {name: target_type, in: query, schema: {type: string, maxLength: 64}}
        - {name: target_id, in: query, schema: {type: string, maxLength: 200}}
      responses:
        "200":
          description: Entri berurutan menurut seq (yang cocok dengan semua filter)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecordPage"}
        "403": {$ref: "#/components/responses/Error"}
  /internal/v1/verify-jobs:
    post:
      operationId: verifyChain
      summary: Mulai tugas verifikasi rantai. Menunggu hingga wait_ms; bila belum selesai, 202 dengan job_id untuk dipoll
      parameters:
        - {name: wait_ms, in: query, schema: {type: integer, minimum: 0, maximum: 10000, default: 2000}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyRequest"}
      responses:
        "200":
          description: Selesai dalam batas tunggu
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        "202":
          description: Masih berjalan
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /internal/v1/verify-jobs/{job_id}:
    get:
      operationId: getVerifyJob
      summary: Status atau hasil tugas verifikasi (termasuk first_bad_seq bila rusak dan anchor_match)
      parameters:
        - {name: job_id, in: path, required: true, schema: {type: string, pattern: "^ver_[A-Za-z0-9]+$"}}
      responses:
        "200":
          description: Tugas
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        "404": {$ref: "#/components/responses/Error"}
  /internal/v1/export:
    get:
      operationId: exportRecords
      summary: Ekspor rentang entri sebagai JSONL (satu entri per baris, field sama dengan Entry), stream. Dapat diverifikasi offline dengan `audit verify-file`
      parameters:
        - {name: from_seq, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: to_seq, in: query, schema: {type: integer, minimum: 1}}
        - name: recipient
          in: query
          description: |
            Penerima age (kunci publik `age1...`), boleh diulang. Bila ada, ekspor dienkripsi (format age) ke semua penerima.
            Bila layanan memakai daftar penerima yang diizinkan (`ASTRIA_EXPORT_AGE_RECIPIENTS`), ekspor tanpa penerima
            ditolak `EKSPOR_WAJIB_TERENKRIPSI` dan penerima di luar daftar ditolak `PENERIMA_TIDAK_DIIZINKAN`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: {type: string, pattern: "^age1[a-z0-9]{58}$"}
      responses:
        "200":
          description: JSONL polos, atau berkas age bila `recipient` diberikan
          content:
            application/x-ndjson: {}
            application/age: {}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /internal/v1/anchor/latest:
    get:
      operationId: latestAnchor
      summary: Jangkar terakhir (seq dan entry_hash kepala rantai saat dijangkar)
      responses:
        "200":
          description: Jangkar
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Anchor"}
        "404": {$ref: "#/components/responses/Error"}
  /internal/v1/anchors:
    get:
      operationId: listAnchors
      summary: Daftar jangkar, terbaru dulu
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Jangkar
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnchorPage"}
    post:
      operationId: createAnchor
      summary: Buat jangkar sekarang dari kepala rantai (admin)
      responses:
        "201":
          description: Jangkar dibuat
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Anchor"}
        "404": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Galat seragam
      content:
        application/json:
          schema: {$ref: "./common.yaml#/components/schemas/Error"}
  schemas:
    RecordReceipt:
      type: object
      additionalProperties: false
      required: [seq, entry_hash, recorded_at, duplicate]
      properties:
        seq: {type: integer, minimum: 0}
        entry_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        recorded_at: {type: string, format: date-time}
        duplicate: {type: boolean}
    Entry:
      type: object
      additionalProperties: false
      required: [seq, occurred_at, recorded_at, actor, actor_type, action, target_type, target_id, via, idempotency_key, payload, payload_hash, prev_hash, entry_hash]
      properties:
        seq: {type: integer, minimum: 0}
        occurred_at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        actor: {type: string}
        actor_type: {type: string}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        via: {type: string}
        idempotency_key: {type: string}
        payload: {type: object}
        payload_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        prev_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        entry_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
    RecordPage:
      type: object
      additionalProperties: false
      required: [items, next_from_seq]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Entry"}
        next_from_seq: {type: [integer, "null"]}
    VerifyRequest:
      type: object
      additionalProperties: false
      properties:
        from_seq: {type: integer, minimum: 1}
        to_seq: {type: integer, minimum: 1}
    VerifyResult:
      type: object
      additionalProperties: false
      required: [status, from_seq, checked]
      properties:
        job_id: {type: string, pattern: "^ver_[A-Za-z0-9]+$"}
        status: {type: string, enum: [berjalan, selesai, gagal]}
        from_seq: {type: integer}
        to_seq: {type: [integer, "null"]}
        checked: {type: integer}
        ok: {type: [boolean, "null"], description: "null selama berjalan atau bila tugas gagal"}
        first_bad_seq: {type: [integer, "null"]}
        reason: {type: [string, "null"], description: "nomor_urut_berlubang, prev_hash_tidak_cocok, payload_hash_tidak_cocok, entry_hash_tidak_cocok"}
        anchor_match: {type: [boolean, "null"], description: "null bila tidak ada jangkar dalam rentang"}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    Anchor:
      type: object
      additionalProperties: false
      required: [anchor_id, seq, entry_hash, created_at]
      properties:
        anchor_id: {type: integer, minimum: 1}
        seq: {type: integer, minimum: 1}
        entry_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        created_at: {type: string, format: date-time}
        exported_to: {type: [string, "null"]}
    AnchorPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Anchor"}
